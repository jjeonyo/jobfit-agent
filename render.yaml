# Render Blueprint: 대시보드에서 New → Blueprint로 이 저장소를 연결하면 생성된다.
# 키 값은 저장소에 넣지 않고 Render 대시보드에서 입력한다 (sync: false).
services:
  - type: web
    name: jobfit-agent
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
