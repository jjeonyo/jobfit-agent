services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data:ro

  # 분석 기록용 n8n (docs/n8n-기록.md). `docker compose --profile record up`일 때만 뜬다.
  n8n:
    image: n8nio/n8n:2.43.7
    profiles: ["record"]
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=Asia/Seoul
      - TZ=Asia/Seoul
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workflows:ro

volumes:
  n8n_data:
